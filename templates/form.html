<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar ítem</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
</head>

<body class="bg-gray-100 p-6 animate-fade-in">
    <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Editar Ítem</h1>
        
        <form method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Nombre del ítem:</label>
                <input name="name" value="{{ item.name }}" class="border border-gray-300 rounded-lg p-3 w-full focus:ring-2 focus:ring-blue-500 outline-none transition-all" required autofocus />
            </div>
            
            <div class="flex items-center pt-4">
                <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold transition-colors shadow-md">Guardar Cambios</button>
                <a href="/" class="ml-auto text-gray-500 hover:text-gray-700 font-medium transition-colors">Cancelar y volver</a>
            </div>
        </form>
    </div>
</body>

</html>
